# Throttle authentication endpoints per client IP (the backend also locks out after repeated failures).
limit_req_zone $binary_remote_addr zone=crm_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=crm_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # nginx drops server-level add_header in any location that sets its own, so each location repeats these.
    set $frame_options "DENY";

    location /api/auth/ {
        limit_req zone=crm_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        limit_req zone=crm_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # Hashed bundles can be cached forever; index.html must always be fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options $frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
