# Srinivas CRM — run with: docker compose up -d --build
# Served over plain HTTP on CRM_PORT (default 8080) so it can sit beside the existing site on port 80.
# .env must set JWT_SECRET_KEY and POSTGRES_PASSWORD (deploy/remote_deploy.sh creates the latter if missing).
name: srinivas-crm

x-db-env: &db-env
  PGHOST: db
  PGUSER: crm
  PGDATABASE: crm
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Sized for a 32 GB / 8 vCPU server; the database is never published outside Docker
    command: >
      postgres -c max_connections=150 -c shared_buffers=1GB -c effective_cache_size=4GB
               -c work_mem=16MB -c maintenance_work_mem=256MB
    volumes:
      - crm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      CRM_CREDENTIALS_FILE: /run/secrets/crm_credentials.json
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@db:5432/crm
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-6}
    volumes:
      # Files from versions before the database; imported once on first start, then kept as-is
      - crm-data:/app/backend/data
      # Generated by deploy/generate_credentials.py; never baked into the image.
      - ./secrets/credentials.json:/run/secrets/crm_credentials.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "${CRM_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Nightly compressed database dumps into ./backups on the host (kept 14 days)
  backup:
    image: postgres:16.4-alpine
    environment:
      <<: *db-env
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["sh", "/backup_loop.sh"]
    volumes:
      - ./deploy/backup_loop.sh:/backup_loop.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  crm-data:
  crm-db:
